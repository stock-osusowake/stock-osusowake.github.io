name: refresh-token

# Instagram API with Unified Login のシステムユーザートークンは期限切れにならないため、
# トークンの更新は不要。このワークフローは、60日間動きがないと定期実行が自動で止まる
# GitHub の仕様への対策として、毎週 heartbeat をコミットし、念のため publish / refresh-token を有効化し直す。
# （ファイル名は互換のためそのまま）

on:
  schedule:
    - cron: "17 18 * * 0"   # 毎週（UTC日曜 18:17 = JST月曜 03:17）
  workflow_dispatch:

permissions:
  contents: write   # 動きの記録（heartbeat）をコミットするため

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 60日間リポジトリに動きがないと定期実行（このワークフロー自身も含む）が止まるため、
      # 毎週、最後に動いた日付を小さなファイルに書いてコミットし、「動きがある」状態を保つ
      - uses: actions/checkout@v4
      - name: Commit heartbeat
        run: |
          set -euo pipefail
          TZ=Asia/Tokyo date +%F > .github/heartbeat
          git config user.name "stock-osusowake-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .github/heartbeat
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "chore: weekly heartbeat"
          git push -q


      # BOT_PAT に Actions: Read and write が必要
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          set -euo pipefail
          for wf in publish.yml refresh-token.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/${wf}/enable"
          done
          echo "Scheduled workflows kept enabled."

      - name: Open failure issue (private queue repo)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          OWNER_LOGIN: ${{ vars.OWNER_LOGIN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          repo="stock-osusowake/post-queue"
          title="定期実行の有効化に失敗しました（$(TZ=Asia/Tokyo date +%F)）"
          body="予約投稿の定期実行を有効に保つ処理に失敗しました。BOT_PAT の期限や権限（Actions: Read and write）を確認してください。実行ログ: $RUN_URL"
          if [ -n "${OWNER_LOGIN:-}" ]; then
            gh issue create --repo "$repo" --title "$title" --body "$body" --assignee "$OWNER_LOGIN" \
              || gh issue create --repo "$repo" --title "$title" --body "$body"
          else
            gh issue create --repo "$repo" --title "$title" --body "$body"
          fi
