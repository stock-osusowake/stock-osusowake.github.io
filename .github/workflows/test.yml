name: test

on:
  push:
    branches: [main]
    paths:
      - "publisher/**"
      - "scripts/**"
      - "public/products.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (publisher)
        working-directory: publisher
        run: python -m unittest -v
      - name: Check products.json
        run: python scripts/check_products.py
